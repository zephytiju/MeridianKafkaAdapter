# SPDX-License-Identifier: Apache-2.0
name: Cluster conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kafka:
    name: Kafka ${{ matrix.kafka-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kafka-version: 4.0.2
            full: true
          - kafka-version: 4.1.2
            full: true
          - kafka-version: 4.2.1
            full: true
          - kafka-version: 4.3.1
            full: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install exact test graph
        run: |
          python -m pip install --require-hashes -r requirements-runtime-lock.txt
          python -m pip install --disable-pip-version-check -e '.[test]' -c requirements-audit.txt
      - name: Install the built artifact for cluster conformance
        run: |
          python -m build
          python -m pip uninstall -y meridian-storage-kafka
          python -m pip install dist/*.whl -c requirements-audit.txt
          python -m pip check
      - name: Run isolated real-cluster matrix
        env:
          FULL: ${{ matrix.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            python conformance/scripts/run_cluster.py --kafka-version "${{ matrix.kafka-version }}" --full
          else
            python conformance/scripts/run_cluster.py --kafka-version "${{ matrix.kafka-version }}"
          fi
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kafka-${{ matrix.kafka-version }}-conformance
          path: |
            evidence/cluster-conformance-${{ matrix.kafka-version }}.json
            evidence/cluster-conformance-${{ matrix.kafka-version }}.xml
          if-no-files-found: error
