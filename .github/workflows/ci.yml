# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact test graph
        run: |
          python -m pip install --require-hashes -r requirements-runtime-lock.txt
          python -m pip install --disable-pip-version-check -e '.[test]' -c requirements-audit.txt
      - name: Run contract and implementation tests
        run: python -m pytest -q -m 'not cluster'

  quality:
    name: Types, lint, security, package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install exact test graph
        run: |
          python -m pip install --require-hashes -r requirements-runtime-lock.txt
          python -m pip install --disable-pip-version-check -e '.[test]' -c requirements-audit.txt
      - name: Check formatting and lint
        run: |
          ruff format --check src scripts conformance/scripts tests
          ruff check src scripts conformance/scripts tests
      - name: Check strict types
        run: mypy src scripts conformance/scripts tests
      - name: Verify package and IaC boundaries
        run: python scripts/verify_boundaries.py
      - name: Run static security checks
        run: bandit -q -c pyproject.toml -r src scripts conformance/scripts
      - name: Audit installed dependency graph
        run: pip-audit --strict --requirement requirements-audit.txt
      - name: Build exactly one distribution
        run: python -m build
      - name: Verify release archives
        run: python scripts/verify_artifacts.py dist/*
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
