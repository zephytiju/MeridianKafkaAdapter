[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-storage-kafka"
version = "1.1.0"
description = "Apache Kafka engine adapter for the Meridian Streaming Catalog"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Meridian contributors" }]
keywords = ["meridian", "kafka", "streaming", "adapter"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "confluent-kafka>=2.15.0,<3",
  "meridian-storage-core>=1.1.0,<2",
  "meridian-storage-semantics>=2.0.1,<3",
  "meridian-storage-streaming>=1.0.1,<2",
]

[project.optional-dependencies]
test = [
  "bandit[toml]==1.8.6",
  "build==1.3.0",
  "hatchling==1.32.0",
  "jsonschema==4.25.1",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest-cov==6.2.1",
  "pytest-timeout==2.4.0",
  "pytest==9.0.3",
  "ruff==0.12.11",
]

[project.entry-points."meridian_storage.adapters"]
kafka = "meridian_storage.adapters.kafka:KafkaAdapterFactory"

[project.urls]
Documentation = "https://github.com/zephytiju/MeridianKafkaAdapter/tree/main/docs"
Issues = "https://github.com/zephytiju/MeridianKafkaAdapter/issues"
Repository = "https://github.com/zephytiju/MeridianKafkaAdapter"

[tool.hatch.build]
include = [
  "src/meridian_storage/adapters/kafka/**/*.json",
  "src/meridian_storage/adapters/kafka/**/*.py",
  "src/meridian_storage/adapters/kafka/py.typed",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/conformance",
  "/docs",
  "/src",
  "/tests",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/requirements-audit.txt",
  "/requirements-runtime-lock.txt",
  "/scripts",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=meridian_storage.adapters.kafka",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=80",
]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
markers = [
  "cluster: requires an explicitly provisioned real Kafka cluster",
  "destructive_cluster: mutates or interrupts only an isolated conformance cluster",
]

[tool.coverage.run]
branch = true
source = ["meridian_storage.adapters.kafka"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
  '\.\.\.',
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PERF", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
